<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOSLimp - Gerenciar Produtos</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/style-produtos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="menu">
        <div class="menu__esquerdo">
            <a href="index.html" class="btn-icon" aria-label="Voltar">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </a>

            <div class="menu__info">
                <svg width="18" height="18" viewBox="0 0 14 13" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0.400024 6.33749C0.400024 3.98062 0.400024 2.80187 1.13252 2.06999C1.86502 1.33812 3.04315 1.33749 5.40002 1.33749H7.90002C10.2569 1.33749 11.4356 1.33749 12.1675 2.06999C12.8994 2.80249 12.9 3.98062 12.9 6.33749V7.58749C12.9 9.94437 12.9 11.1231 12.1675 11.855C11.435 12.5869 10.2569 12.5875 7.90002 12.5875H5.40002C3.04315 12.5875 1.8644 12.5875 1.13252 11.855C0.400649 11.1225 0.400024 9.94437 0.400024 7.58749V6.33749Z" stroke="gray" stroke-width="0.8" />
                    <path d="M3.52502 1.33749V0.399994M9.77502 1.33749V0.399994M0.712524 4.46249H12.5875" stroke="gray" stroke-width="0.8" stroke-linecap="round" />
                </svg>
                <span id="menu-data"></span>
            </div>

            <div class="menu__info">
                <svg width="18" height="18" viewBox="0 0 17 17" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8.5 0C10.7543 0 12.9163 0.895533 14.5104 2.48959C16.1045 4.08365 17 6.24566 17 8.5C17 10.7543 16.1045 12.9163 14.5104 14.5104C12.9163 16.1045 10.7543 17 8.5 17C6.24566 17 4.08365 16.1045 2.48959 14.5104C0.895533 12.9163 0 10.7543 0 8.5C0 6.24566 0.895533 4.08365 2.48959 2.48959C4.08365 0.895533 6.24566 0 8.5 0ZM8.5 0.894737C6.48296 0.894737 4.54853 1.696 3.12227 3.12227C1.696 4.54853 0.894737 6.48296 0.894737 8.5C0.894737 10.517 1.696 12.4515 3.12227 13.8777C4.54853 15.304 6.48296 16.1053 8.5 16.1053C9.49874 16.1053 10.4877 15.9085 11.4104 15.5263C12.3331 15.1441 13.1715 14.5839 13.8777 13.8777C14.5839 13.1715 15.1441 12.3331 15.5263 11.4104C15.9085 10.4877 16.1053 9.49874 16.1053 8.5C16.1053 6.48296 15.304 4.54853 13.8777 3.12227C12.4515 1.696 10.517 0.894737 8.5 0.894737ZM8.05263 3.57895H8.94737V8.42842L13.1526 10.8532L12.7053 11.6316L8.05263 8.94737V3.57895Z" fill="gray" />
                </svg>
                <span id="menu-hora">--:-- --</span>
            </div>

            <div class="menu__info">
                <svg width="11" height="15" viewBox="0 0 11 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10.3129 3.60713C9.18053 2.87444 7.18791 2.36566 5.35638 2.33323M5.35638 2.33323C3.17763 2.2954 1.22678 2.93389 1.22678 4.67566C1.22678 7.88279 10.3129 6.27922 10.3129 9.48635C10.3129 11.3161 7.89428 12.1021 5.35638 12.0426M5.35638 2.33323V0.399994M0.399902 10.5557C1.46541 11.4744 3.4449 11.9979 5.35638 12.0426M5.35638 12.0426V14.2971" stroke="gray" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>CAIXA ATUAL: </span>
                <strong id="menu-caixa-valor">R$ 0,00</strong>
            </div>

            <div class="menu__info">
                <svg width="20" height="16" viewBox="0 0 24 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1.53733 1.33333V0H21.7427V1.33333H1.53733ZM1.64 20V12H0V10.6667L1.53733 4H21.7427L23.2813 10.6667V12H21.64V20H20.3067V12H13.64V20H1.64ZM2.97333 18.6667H12.3067V12H2.97333V18.6667ZM1.34667 10.6667H21.9333L20.696 5.33333H2.584L1.34667 10.6667Z" fill="gray" />
                </svg>
                <span id="loja-nome">Carregando...</span>
            </div>
        </div>
        <div class="menu__direito">
            <button class="btn-fechar-caixa">
                GESTOR PRODUTOS
            </button>
        </div>
    </header>

    <div class="layout">
        <main class="catalogo">
            <nav class="categorias" id="categorias-nav">
                <button class="categoria-card active" data-category="todas">
                    <div class="categoria-card__icone">
                        <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <rect x="2" y="7" width="20" height="14" rx="2" />
                            <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" />
                        </svg>
                    </div>
                    <span class="categoria-card__label">Todas categorias</span>
                    <span class="categoria-card__count" id="total-count">... itens</span>
                </button>
            </nav>

            <div class="gestao-lista-container">
                <table class="tabela-gestao">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Marca</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Status</th>
                            <th style="text-align: right;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-produtos-body">
                    </tbody>
                </table>
            </div>
        </main>

        <aside class="sidebar">
            <div class="sidebar__scroll-area">
                <h2 class="sidebar__titulo" id="titulo-formulario">Novo Produto</h2>
                <input type="hidden" id="cod_produto" value="">
                
                <form id="form-produto" class="form-gestao">
                    <div class="input-group">
                        <label>Imagem do Produto</label>
                        <div class="image-upload-container">
                            <img id="preview-imagem" src="" class="preview-img-form">
                            <input type="file" id="imagem_produto" accept="image/*" class="input-file-custom">
                            <input type="hidden" id="url_imagem_atual">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="nome_produto">Nome do Produto</label>
                        <input type="text" id="nome_produto" class="barra-de-busca__input" required>
                    </div>

                    <div class="input-group">
                        <label for="marca_produto">Marca</label>
                        <input type="text" id="marca_produto" class="barra-de-busca__input" required>
                    </div>

                    <div class="input-group">
                        <label for="categoria_produto">Categoria</label>
                        <select id="categoria_produto" class="barra-de-busca__input" required>
                            <option value="">Selecione...</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="preco_produto">Preço Unitário (R$)</label>
                        <input type="number" id="preco_produto" step="0.01" class="barra-de-busca__input" required>
                    </div>

                    <div class="input-group">
                        <label>Fragrâncias</label>
                        <div id="lista-fragrancias" class="fragrancias-selecao">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="descricao_produto">Descrição</label>
                        <textarea id="descricao_produto" class="barra-de-busca__input" rows="3" style="border-radius: 8px; resize: none;"></textarea>
                    </div>

                    <div class="input-group" style="flex-direction: row; align-items: center; gap: 8px;">
                        <input type="checkbox" id="ativo" checked style="width: 16px; height: 16px;">
                        <label for="ativo">Produto Ativo</label>
                    </div>

                    <div class="form-acoes">
                        <button type="button" class="btn-descartar" id="btn-limpar-form" title="Limpar formulário">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                            </svg>
                        </button>
                        <button type="submit" class="btn-registrar">SALVAR PRODUTO</button>
                    </div>
                </form>
            </div>
        </aside>
    </div>

    <script src="./js/produtos-gestao.js"></script>
</body>
</html>
